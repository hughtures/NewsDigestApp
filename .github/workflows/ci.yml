name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "News Digest.xcodeproj" \
            -scheme "News Digest" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
